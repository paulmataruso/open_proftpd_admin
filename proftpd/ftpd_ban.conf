# Session log for ciosuseradd-ftpban (the FTP ban detector).
# Install at /etc/proftpd/ftpd_ban.conf and add to proftpd.conf:
#   Include /etc/proftpd/ftpd_ban.conf
# One line per AUTH/READ command and per session end:
#   epoch|pid|ip|user|cmd|status|end-reason
# Keep this OUT of FTP_LOG_DIR: the logtailer ingests every archive found there.
# Enforcement is nftables (see ftpban/ftpban.py) — do NOT enable mod_ban here:
# on ProFTPd 1.3.8b a reload with mod_ban configured segfaults the master.
LogFormat ciosban "%{epoch}|%P|%a|%u|%m|%s|%E"
ExtendedLog /var/log/proftpd-ciosban/session.log AUTH,READ,EXIT ciosban
